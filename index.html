<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordMaster – Oxford 3000 | A1–B2</title>
<style>
  :root {
    --bg: #f0f4f8; --card: #ffffff; --primary: #2563eb; --primary-dark: #1d4ed8;
    --success: #16a34a; --danger: #dc2626; --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  [data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --primary-dark: #2563eb;
    --success: #22c55e; --danger: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
    --border: #334155; --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
  .container { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; margin-bottom: 20px; }
  h1 { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
  .theme-btn { background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border-radius: 16px; padding: 16px; text-align: center; box-shadow: var(--shadow); }
  .stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .stat-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  .menu-grid { display: grid; gap: 12px; }
  .menu-btn { background: var(--card); border: none; border-radius: 16px; padding: 18px; text-align: right; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; transition: transform 0.15s; }
  .menu-btn:hover { transform: translateY(-2px); }
  .menu-btn .icon { font-size: 1.7rem; width: 48px; height: 48px; background: #eff6ff; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  [data-theme="dark"] .menu-btn .icon { background: #1e3a5f; }
  .menu-btn .title { font-size: 1.05rem; font-weight: 600; }
  .menu-btn .desc { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

  .card-container { margin: 20px 0; }
  .flashcard { background: var(--card); border-radius: 20px; min-height: 300px; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; }
  .flashcard .front, .flashcard .back { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px 20px; text-align: center; }
  .flashcard .front { opacity: 1; visibility: visible; z-index: 2; transition: opacity 0.3s ease; }
  .flashcard .back { opacity: 0; visibility: hidden; z-index: 1; transition: opacity 0.3s ease; }
  .flashcard.flipped .front { opacity: 0; visibility: hidden; z-index: 1; }
  .flashcard.flipped .back { opacity: 1; visibility: visible; z-index: 2; }

  .word-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
  .word { font-size: 2rem; font-weight: 700; direction: ltr; }
  .pos { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
  .level-tag { display: inline-block; background: #dbeafe; color: #1e40af; font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
  [data-theme="dark"] .level-tag { background: #1e3a5f; color: #93c5fd; }
  .meaning { font-size: 1.35rem; font-weight: 600; color: var(--primary); margin: 12px 0; direction: rtl; }
  .example { font-size: 0.95rem; color: var(--muted); line-height: 1.55; max-width: 92%; direction: ltr; margin-top: 8px; }

  .speak-btn { background: #eff6ff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .speak-btn:hover { background: #dbeafe; transform: scale(1.1); }
  [data-theme="dark"] .speak-btn { background: #1e3a5f; }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 110px; padding: 14px 16px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }

  .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 16px 0; }
  .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }
  .score-display { text-align: center; font-size: 1.1rem; margin: 8px 0; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
  .nav-item { background: none; border: none; color: var(--muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item span { font-size: 1.3rem; }
  .content { padding-bottom: 80px; }

  .stats-list { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .stats-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .stats-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="container content">
  <header>
    <h1>WordMaster – Oxford 3000</h1>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </header>

  <div id="home" class="screen active">
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">إجمالي الكلمات</div></div>
      <div class="stat-card"><div class="num" id="statMastered">0</div><div class="label">متقنة</div></div>
      <div class="stat-card"><div class="num" id="statDue">0</div><div class="label">مستحقة للمراجعة</div></div>
    </div>
    <div class="menu-grid">
      <button class="menu-btn" onclick="startMode('flash')">
        <div class="icon">🃏</div>
        <div><div class="title">البطاقات التعليمية</div><div class="desc">اقلب البطاقة لترى المعنى والمثال</div></div>
      </button>
      <button class="menu-btn" onclick="startMode('review')">
        <div class="icon">🔄</div>
        <div><div class="title">المراجعة المتباعدة</div><div class="desc">راجع الكلمات المستحقة فقط</div></div>
      </button>
      <button class="menu-btn" onclick="showScreen('stats')">
        <div class="icon">📊</div>
        <div><div class="title">الإحصائيات</div><div class="desc">تتبع تقدمك حسب المستوى</div></div>
      </button>
    </div>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levelSelect" class="screen">
    <h2 style="margin-bottom:16px;">اختر المستوى</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
      <button class="btn btn-outline" style="padding:18px;font-size:1.1rem;" onclick="selectLevel('A1')">A1</button>
      <button class="btn btn-outline" style="padding:18px;font-size:1.1rem;" onclick="selectLevel('A2')">A2</button>
      <button class="btn btn-outline" style="padding:18px;font-size:1.1rem;" onclick="selectLevel('B1')">B1</button>
      <button class="btn btn-outline" style="padding:18px;font-size:1.1rem;" onclick="selectLevel('B2')">B2</button>
      <button class="btn btn-primary" style="padding:18px;font-size:1.1rem;grid-column:1/-1;" onclick="selectLevel('ALL')">كل المستويات (A1–B2)</button>
    </div>
    <button class="btn btn-outline" onclick="showScreen('home')">رجوع</button>
  </div>

  <div id="flash" class="screen">
    <div class="progress-bar"><div class="progress-fill" id="flashProgress"></div></div>
    <div class="score-display" id="flashCounter"></div>
    <div class="card-container">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="front">
          <div class="level-tag" id="fLevel">A1</div>
          <div class="word-row">
            <div class="word" id="fWord"></div>
            <button class="speak-btn" onclick="event.stopPropagation(); speakWord(document.getElementById('fWord').textContent)" title="نطق أمريكي">🔊</button>
          </div>
          <div class="pos" id="fPos"></div>
          <div style="font-size:0.85rem;color:var(--muted);margin-top:16px;">اضغط لقلب البطاقة</div>
        </div>
        <div class="back">
          <div class="meaning" id="fMeaning"></div>
          <div class="example" id="fExample"></div>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" onclick="rateCard(1)">صعبة</button>
      <button class="btn btn-outline" onclick="rateCard(2)">متوسطة</button>
      <button class="btn btn-success" onclick="rateCard(3)">سهلة</button>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-outline" onclick="showScreen('home')">إنهاء</button>
    </div>
  </div>

  <div id="stats" class="screen">
    <h2 style="margin-bottom:16px;">الإحصائيات حسب المستوى</h2>
    <div class="stats-list" id="statsContent"></div>
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-outline" onclick="showScreen('home')">رجوع</button>
      <button class="btn btn-danger" onclick="resetProgress()">إعادة تعيين</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" onclick="showScreen('home')"><span>🏠</span>الرئيسية</button>
  <button class="nav-item" onclick="startMode('flash')"><span>🃏</span>بطاقات</button>
  <button class="nav-item" onclick="startMode('review')"><span>🔄</span>مراجعة</button>
  <button class="nav-item" onclick="showScreen('stats')"><span>📊</span>إحصاء</button>
</div>

// ===================== STATE =====================
let currentMode = null;
let currentLevel = 'ALL';
let currentList = [];
let currentIndex = 0;
let progress = {};

// Safe localStorage (some mobile browsers block it for local HTML files)
function loadProgress() {
  try {
    progress = JSON.parse(localStorage.getItem('wm_oxford_progress') || '{}');
  } catch (e) {
    progress = {};
  }
}
function saveProgress() {
  try {
    localStorage.setItem('wm_oxford_progress', JSON.stringify(progress));
  } catch (e) { /* ignore if blocked */ }
  updateHomeStats();
}
loadProgress();

allWords.forEach(w => {
  if (!w.l) w.l = 'A1';
  if (!progress[w.w]) {
    progress[w.w] = { interval: 0, ease: 2.5, next: 0, correct: 0, wrong: 0, seen: 0 };
  }
});

function speakWord(word) {
  if (!word || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const us = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en'));
  if (us) u.voice = us;
  window.speechSynthesis.speak(u);
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateHomeStats();
  if (id === 'stats') renderStats();
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  try { localStorage.setItem('wm_a1_theme', isDark ? 'light' : 'dark'); } catch(e) {}
}
try {
  if (localStorage.getItem('wm_a1_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    const tb = document.getElementById('themeBtn');
    if (tb) tb.textContent = '☀️';
  }
} catch(e) {}

function updateHomeStats() {
  const now = Date.now();
  let mastered = 0, due = 0;
  allWords.forEach(w => {
    const p = progress[w.w];
    if (p.interval >= 21) mastered++;
    if (p.next <= now && p.seen > 0) due++;
  });
  document.getElementById('statTotal').textContent = allWords.length;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statDue').textContent = due;
}

function startMode(mode) {
  currentMode = mode;
  showScreen('levelSelect');
}

function selectLevel(level) {
  currentLevel = level;
  currentList = level === 'ALL' ? [...allWords] : allWords.filter(w => w.l === level);
  currentList = currentList.sort(() => Math.random() - 0.5);
  currentIndex = 0;

  if (currentMode === 'review') {
    const now = Date.now();
    currentList = currentList.filter(w => progress[w.w] && progress[w.w].next <= now && progress[w.w].seen > 0);
    if (currentList.length === 0) {
      alert('لا توجد كلمات مستحقة للمراجعة في هذا المستوى حالياً.\nابدأ بالبطاقات التعليمية أولاً.');
      showScreen('home');
      return;
    }
  }
  showScreen('flash');
  showCard();
}

function showCard() {
  if (currentIndex >= currentList.length) {
    alert('أحسنت! انتهيت من جميع الكلمات في هذه الجولة.');
    showScreen('home');
    return;
  }
  const w = currentList[currentIndex];
  document.getElementById('fWord').textContent = w.w;
  document.getElementById('fPos').textContent = w.p;
  document.getElementById('fLevel').textContent = w.l || 'A1';
  document.getElementById('fMeaning').textContent = w.m;
  document.getElementById('fExample').textContent = w.e;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('flashCounter').textContent = `${currentIndex + 1} / ${currentList.length}`;
  document.getElementById('flashProgress').style.width = (currentIndex / currentList.length * 100) + '%';
}

function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}

function rateCard(quality) {
  const w = currentList[currentIndex];
  const p = progress[w.w];
  p.seen++;
  if (quality === 1) {
    p.wrong++;
    p.interval = 0;
    p.ease = Math.max(1.3, p.ease - 0.2);
    p.next = Date.now() + 10 * 60 * 1000;
  } else if (quality === 2) {
    p.interval = Math.max(1, p.interval);
    p.ease = Math.max(1.3, p.ease - 0.15);
    p.next = Date.now() + p.interval * 24 * 60 * 60 * 1000;
  } else {
    p.correct++;
    if (p.interval === 0) p.interval = 1;
    else if (p.interval === 1) p.interval = 3;
    else p.interval = Math.round(p.interval * p.ease);
    p.ease = Math.min(2.5, p.ease + 0.1);
    p.next = Date.now() + p.interval * 24 * 60 * 60 * 1000;
  }
  saveProgress();
  currentIndex++;
  showCard();
}

function renderStats() {
  let html = '';
  const now = Date.now();
  ['A1', 'A2', 'B1', 'B2'].forEach(level => {
    const words = allWords.filter(w => (w.l || 'A1') === level);
    let mastered = 0, seen = 0, due = 0;
    words.forEach(w => {
      const p = progress[w.w] || {seen:0, interval:0, next:0};
      if (p.seen > 0) seen++;
      if (p.interval >= 21) mastered++;
      if (p.next <= now && p.seen > 0) due++;
    });
    const pct = words.length ? Math.round((mastered / words.length) * 100) : 0;
    html += `
      <div class="stats-item">
        <div><strong>مستوى ${level}</strong><br><small style="color:var(--muted)">${seen} شوهدت · ${due} مستحقة</small></div>
        <div style="text-align:left"><strong style="color:var(--primary)">${pct}%</strong><br><small>${mastered}/${words.length}</small></div>
      </div>`;
  });
  document.getElementById('statsContent').innerHTML = html;
}

function resetProgress() {
  if (confirm('هل أنت متأكد من إعادة تعيين كل التقدم؟')) {
    progress = {};
    allWords.forEach(w => {
      progress[w.w] = { interval: 0, ease: 2.5, next: 0, correct: 0, wrong: 0, seen: 0 };
    });
    saveProgress();
    renderStats();
    alert('تم إعادة التعيين.');
  }
}

// Run after DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', updateHomeStats);
} else {
  updateHomeStats();
}
</script>
